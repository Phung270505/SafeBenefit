[General]
network = GraphQuery
seed-set = 42
num-rngs = 8
# A batch contains many queries. Bound each query with **.app[0].timeout below;
# a single 200s global cap silently truncated large evaluation batches.
cmdenv-express-mode = true
record-eventlog = false
result-dir = ../../../output/current/simulation/graph_query
output-scalar-file = ${resultdir}/${configname}.sca
**.vector-recording = false
**.scalar-recording = true
*.coordinator.numApps = 1
*.worker[*].numApps = 1
*.coordinator.app[0].typename = "GraphQueryApp"
*.worker[*].app[0].typename = "GraphQueryApp"
*.coordinator.app[0].coordinator = true
*.worker[*].app[0].workerId = parentIndex()
*.coordinator.app[0].workerCount = 4
*.worker[*].app[0].workerCount = 4
*.coordinator.app[0].inputDirectory = "../../../output/current/cache/materialized/calibration/ldbc_snb_i1_v100_sf01"
*.worker[*].app[0].inputDirectory = "../../../output/current/cache/materialized/calibration/ldbc_snb_i1_v100_sf01"
*.coordinator.app[0].outputFile = "../../../output/current/simulation/graph_query/default.jsonl"
**.app[0].method = "STATIC"
**.app[0].timeout = 120s
**.app[0].retryInterval = 90s
**.eth[*].queue.typename = "DropTailQueue"
**.eth[*].queue.packetCapacity = 100000
*.scenarioManager.script = xml("<scenario/>")

[Config Stable]

[Config LostReady]
*.coordinator.app[0].retryInterval = 1s
*.worker[0].app[0].dropFirstVerb = "READY"

[Config LostAck]
*.coordinator.app[0].retryInterval = 1s
*.worker[0].app[0].dropFirstVerb = "ACK"
*.coordinator.app[0].alwaysPrepare = true

[Config LostData]
*.coordinator.app[0].retryInterval = 1s
*.worker[0].app[0].dropFirstVerb = "DATA"
*.worker[0].app[0].dropQueryIndex = 0

[Config LostScan]
*.coordinator.app[0].retryInterval = 1s
*.coordinator.app[0].dropFirstVerb = "SCAN"

[Config LostExecute]
*.coordinator.app[0].retryInterval = 1s
*.coordinator.app[0].dropFirstVerb = "EXECUTE"

[Config PermanentFailure]
*.coordinator.app[0].retryInterval = 1s
*.worker[0].app[0].permanentFailure = true
*.coordinator.app[0].maxRetries = 3

[Config CancelQuery]
*.coordinator.app[0].cancelAfter = 20ms
*.worker[0].app[0].queueDelay = 50ms

[Config CpuPressure]
*.worker[0].app[0].cpuMultiplier = 0.25

[Config MemoryPressure]
*.worker[0].app[0].memoryBytes = 128

[Config WorkerSkew]
*.worker[0].app[0].queueDelay = 20ms

[Config DuplicateReplies]
*.worker[*].app[0].duplicateReplies = true

[Config PrepareFailure]
*.worker[0].app[0].rejectPrepare = true
*.coordinator.app[0].alwaysPrepare = true

[Config LatencyOnset]
*.scenarioManager.script = xml('<scenario><set-channel-param t="0.15s" src-module="worker[0]" src-gate="ethg$o[0]" par="delay" value="1.05ms"/><set-channel-param t="1.2s" src-module="worker[0]" src-gate="ethg$o[0]" par="delay" value="50us"/></scenario>')

[Config BandwidthOnset]
*.scenarioManager.script = xml('<scenario><set-channel-param t="0.15s" src-module="worker[0]" src-gate="ethg$o[0]" par="datarate" value="100Mbps"/><set-channel-param t="1.2s" src-module="worker[0]" src-gate="ethg$o[0]" par="datarate" value="1Gbps"/></scenario>')

[Config Mixed]
extends = LatencyOnset
*.worker[0].app[0].cpuMultiplier = 0.25
*.worker[0].app[0].memoryBytes = 128
